<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="990" viewBox="0 0 1120 990" role="img" aria-labelledby="t d"><title id="t">Measure the prediction. Test the explanation. Each needs its own evidence. Concept network artwork.</title><desc id="d">Conceptual ECG and model illustration, not a patient waveform, measured result or accepted symbolic equation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes beat{0%,100%{transform:scaleY(.83)}42%{transform:scaleY(1.06)}60%{transform:scaleY(.91)}}.beat{animation:beat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes edge{0%,100%{opacity:.4;stroke-width:2}50%{opacity:1;stroke-width:3}}.edge{animation:edge 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.beat,.edge{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M32 24H1088" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="72" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">KAN × ECG / RESEARCH THAT KEEPS ITS QUESTIONS</text><text x="30" y="181" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="72" font-weight="700" text-anchor="start">Measure the prediction.</text><text x="30" y="272" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="76" font-weight="700" text-anchor="start">Test the explanation.</text><text x="32" y="362" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">A convincing model and a faithful equation each</text><text x="32" y="396" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start">need their own evidence.</text><g transform="translate(705 475) scale(1.03)"><path d="M12 24C70 -19 115 113 163 70" fill="none" stroke="#FF4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-0.0s"/><path d="M12 24C70 -19 115 209 163 166" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-1.2s"/><path d="M12 118C70 75 115 113 163 70" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-1.2s"/><path d="M12 118C70 75 115 209 163 166" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-2.4s"/><path d="M12 212C70 169 115 113 163 70" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-2.4s"/><path d="M12 212C70 169 115 209 163 166" fill="none" stroke="#F3D962" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-3.5999999999999996s"/><path d="M187 70C245 27 270 161 318 118" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-1.2s"/><path d="M187 166C245 123 270 161 318 118" fill="none" stroke="#BCFCF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="edge" style="animation-delay:-2.4s"/><circle cx="0" cy="24" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><circle cx="0" cy="118" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><circle cx="0" cy="212" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><circle cx="175" cy="70" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><circle cx="175" cy="166" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><circle cx="330" cy="118" r="11" fill="#0E1116" stroke="#BCFCF6" stroke-width="2"/><text x="165" y="274" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">LEARNED EDGE FUNCTIONS / CONCEPT</text></g><g transform="translate(32 845) scale(0.8636363636363636)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(92 845) scale(0.8636363636363636)"><path d="M8 7h1M8 22h1M8 37h1M35 14h1M35 30h1M8 7l27 7M8 22l27-8M8 22l27 8M8 37l27-7" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(152 845) scale(0.8636363636363636)"><path d="M6 6h32v34H6zM12 14l3 3 5-6M25 14h7M12 27l3 3 5-6M25 27h7" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="32" y="945" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">ADIL SUKUMAR × SOMYA SISODIA</text></svg>