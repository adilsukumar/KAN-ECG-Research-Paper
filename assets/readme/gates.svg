<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="708" viewBox="0 0 1120 708" role="img" aria-labelledby="t d"><title id="t">Five joint acceptance criteria. Original thresholds remain in the study table; no accepted equation is implied.</title><desc id="d">Conceptual ECG and model illustration, not a patient waveform, measured result or accepted symbolic equation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes beat{0%,100%{transform:scaleY(.83)}42%{transform:scaleY(1.06)}60%{transform:scaleY(.91)}}.beat{animation:beat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes edge{0%,100%{opacity:.4;stroke-width:2}50%{opacity:1;stroke-width:3}}.edge{animation:edge 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.beat,.edge{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="53" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">ONE STUDY / FIVE JOINT ACCEPTANCE GATES</text><rect x="24" y="90" width="1072" height="85" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="141" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Probability fidelity</text><circle class="glow" style="animation-delay:-0.0s" cx="1062" cy="132" r="8" fill="none" stroke="#FF4081" stroke-width="2"/><rect x="24" y="193" width="1072" height="85" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="244" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Decision agreement</text><circle class="glow" style="animation-delay:-1.1s" cx="1062" cy="235" r="8" fill="none" stroke="#FF4081" stroke-width="2"/><rect x="24" y="296" width="1072" height="85" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="347" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Ventricular sensitivity</text><circle class="glow" style="animation-delay:-2.2s" cx="1062" cy="338" r="8" fill="none" stroke="#FF4081" stroke-width="2"/><rect x="24" y="399" width="1072" height="85" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="450" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Relative sensitivity loss</text><circle class="glow" style="animation-delay:-3.3000000000000003s" cx="1062" cy="441" r="8" fill="none" stroke="#FF4081" stroke-width="2"/><rect x="24" y="502" width="1072" height="85" rx="14" fill="#151420" stroke="#363348"/><text x="48" y="553" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Expression complexity</text><circle class="glow" style="animation-delay:-4.4s" cx="1062" cy="544" r="8" fill="none" stroke="#FF4081" stroke-width="2"/><text x="32" y="665" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">ALL GATES MUST PASS / ORIGINAL THRESHOLDS BELOW</text></svg>