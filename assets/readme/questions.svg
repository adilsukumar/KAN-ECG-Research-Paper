<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="288" viewBox="0 0 1120 288" role="img" aria-labelledby="t d"><title id="t">Classifier evaluation and symbolic approximation are separate research questions.</title><desc id="d">Conceptual ECG and model illustration, not a patient waveform, measured result or accepted symbolic equation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes beat{0%,100%{transform:scaleY(.83)}42%{transform:scaleY(1.06)}60%{transform:scaleY(.91)}}.beat{animation:beat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes edge{0%,100%{opacity:.4;stroke-width:2}50%{opacity:1;stroke-width:3}}.edge{animation:edge 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.beat,.edge{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="524" height="250" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 34) scale(0.8636363636363636)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">CLASSIFIER EVALUATION</text><text x="48" y="124" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Frozen preprocessing, models and</text><text x="48" y="158" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">thresholds across the stated</text><text x="48" y="192" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">cohorts.</text><rect x="572" y="12" width="524" height="250" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(594 34) scale(0.8636363636363636)"><path d="M6 6h32v34H6zM12 14l3 3 5-6M25 14h7M12 27l3 3 5-6M25 27h7" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="652" y="62" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">SYMBOLIC APPROXIMATION</text><text x="596" y="124" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Audit fidelity, agreement,</text><text x="596" y="158" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">sensitivity and expression</text><text x="596" y="192" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">complexity together.</text></svg>