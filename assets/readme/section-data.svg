<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="168" viewBox="0 0 1120 168" role="img" aria-labelledby="t d"><title id="t">FROM BEAT TO FEATURE. Dataset roles, processing choices and twelve engineered features.</title><desc id="d">Conceptual ECG and model illustration, not a patient waveform, measured result or accepted symbolic equation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes beat{0%,100%{transform:scaleY(.83)}42%{transform:scaleY(1.06)}60%{transform:scaleY(.91)}}.beat{animation:beat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes edge{0%,100%{opacity:.4;stroke-width:2}50%{opacity:1;stroke-width:3}}.edge{animation:edge 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.beat,.edge{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><path d="M28 12H1092" fill="none" stroke="#363348" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(30 40) scale(0.9090909090909091)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="94" y="72" fill="#F8F8F3" font-family="Bahnschrift, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">FROM BEAT TO FEATURE</text><text x="32" y="128" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Dataset roles, processing choices and twelve engineered features.</text><circle class="glow" cx="1088" cy="148" r="4" fill="#F3D962"/></svg>