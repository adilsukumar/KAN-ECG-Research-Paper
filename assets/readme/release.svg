<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="t d"><title id="t">Source archive, staged execution and release manifest. Reproduction must be verified separately.</title><desc id="d">Conceptual ECG and model illustration, not a patient waveform, measured result or accepted symbolic equation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes beat{0%,100%{transform:scaleY(.83)}42%{transform:scaleY(1.06)}60%{transform:scaleY(.91)}}.beat{animation:beat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes edge{0%,100%{opacity:.4;stroke-width:2}50%{opacity:1;stroke-width:3}}.edge{animation:edge 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.beat,.edge{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">THE SOURCE RELEASE / THE REPRODUCTION PATH</text><g transform="translate(58 102) scale(1.04)"><path d="M0 0H470" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 45H470" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 90H470" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 135H470" fill="none" stroke="#363348" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><g class="beat"><path d="M0 74H34Q47 56 60 74H91L105 88L122 12L140 126L157 74H197Q217 47 242 74H268L282 88L299 12L317 126L334 74H376Q397 47 421 74H470" fill="none" stroke="#BCFCF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="0" y="180" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">SYNTHETIC SIGNAL / CONCEPT ART</text></g><text x="665" y="134" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">SOURCE ARCHIVE</text><text x="665" y="174" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Output-cleared notebooks and</text><text x="665" y="208" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">scientific source/protocol</text><text x="665" y="242" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">files.</text><text x="665" y="273" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">STAGED EXECUTION</text><text x="665" y="313" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Follow the original phases</text><text x="665" y="347" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">and artifact dependencies.</text><text x="665" y="412" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">RELEASE IDENTITY</text><text x="665" y="452" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">The source manifest checks</text><text x="665" y="486" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">bytes; reproduction is a</text><text x="665" y="520" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">separate task.</text></svg>